# Endpoint donde la pasarela escucha las llamadas del procesador (object adapter "Gateway")
Gateway.Endpoints=tcp -h 0.0.0.0 -p 10000

# Donde esta el procesador de tu companero (TransactionNotifier). Cambiar la IP/puerto aqui, sin recompilar.
TransactionNotifier.Proxy=TransactionNotifier:tcp -h 10.232.215.231 -p 10001

# Hilos de Ice para atender llamadas entrantes (el trabajo lento NO corre aqui)
Ice.ThreadPool.Server.Size=4